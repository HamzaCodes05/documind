services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://documind:documind@db:5432/documind
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://documind:documind@db:5432/documind
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - db
      - ai-service
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
